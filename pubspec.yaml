name: islamic_text
description: A Flutter package for processing Islamic text, including ligature replacement and glyph rendering.
version: 2.0.0
homepage: https://github.com/tripletroop/flutter_islamic_text
repository: https://github.com/tripletroop/flutter_islamic_text

topics:
  - flutter
  - arabic
  - islamic
  - text-rendering
  - material-design

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/fonts/islamic_phrases.ttf